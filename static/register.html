<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Farming Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; background-color: #f4f9f4;
            color: #1a3d1a; display: flex; flex-direction: column;
            min-height: 100vh; justify-content: center; align-items: center; padding: 20px;
        }
        .box {
            background: white; width: 100%; max-width: 420px;
            padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-top: 5px solid #2d5e2d;
        }
        h2 { color: #2d5e2d; margin-bottom: 20px; font-size: 1.3rem; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 0.95rem; }
        input {
            width: 100%; padding: 11px; border: 1.5px solid #ccc;
            border-radius: 8px; font-size: 0.95rem; margin-bottom: 15px; font-family: inherit;
        }
        input:focus { border-color: #2d5e2d; outline: none; }
        button {
            width: 100%; background: #2d5e2d; color: white;
            border: none; padding: 13px; font-weight: bold;
            border-radius: 8px; cursor: pointer; font-size: 1rem; margin-top: 5px;
        }
        button:hover { background: #1b5e20; }
        .btn-guest {
            background: #f59e0b;
        }
        .btn-guest:hover { background: #d97706; }
        .btn-skip {
            background: none; color: #2d5e2d; border: 2px solid #2d5e2d;
        }
        .btn-skip:hover { background: #f0f7f0; }
        .divider {
            text-align: center; color: #999; font-size: 0.85rem;
            margin: 18px 0; position: relative;
        }
        .divider::before, .divider::after {
            content: ''; position: absolute; top: 50%;
            width: 40%; height: 1px; background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .guest-box {
            background: #fff8e1; padding: 15px; border-radius: 8px;
            border-left: 4px solid #f59e0b; margin-top: 5px;
        }
        .guest-box label { color: #92400e; }
        .otp-box {
            background: #fff8e1; padding: 15px; border-radius: 8px;
            border-left: 4px solid #f59e0b; margin-top: 15px; display: none;
        }
        .otp-box p { color: #92400e; font-size: 0.9rem; margin-bottom: 8px; }
        .spam-note {
            background: #fff3cd; border-left: 3px solid #ffc107;
            padding: 8px 10px; border-radius: 0 6px 6px 0;
            font-size: 0.8rem; color: #856404; margin-bottom: 10px;
        }
        .link { text-align: center; margin-top: 15px; font-size: 0.9rem; }
        .link a { color: #2d5e2d; text-decoration: none; font-weight: bold; }
        #status-msg { margin-top: 15px; font-weight: bold; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🌾 Create Account</h2>

        <div id="register-step">
            <label>Username:</label>
            <input type="text" id="reg-username" placeholder="Choose a username">

            <label>Email Address:</label>
            <input type="email" id="reg-email" placeholder="Enter your email">

            <label>Password:</label>
            <input type="password" id="reg-password" placeholder="Min 6 characters">

            <label>Confirm Password:</label>
            <input type="password" id="reg-confirm" placeholder="Repeat your password">

            <button onclick="sendOTP()">Continue with Email OTP</button>
        </div>

        <div class="otp-box" id="otp-step">
            <p>✅ OTP sent to your email!</p>
            <div class="spam-note">📬 Check your <b>Spam/Junk</b> folder if not in inbox.</div>
            <label>Enter 6-digit OTP:</label>
            <input type="text" id="otp-input" placeholder="Enter OTP" maxlength="6">
            <button onclick="verifyAndRegister()" style="background:#f59e0b;">Verify & Create Account</button>
        </div>

        <div class="divider">or</div>

        <div class="guest-box">
            <label>Guest name:</label>
            <input type="text" id="guest-username" placeholder="Enter any name to continue as guest" style="margin-bottom:10px;">
            <button class="btn-guest" onclick="guestLogin()">⚡ Continue as Guest</button>
        </div>

        <button class="btn-skip" onclick="skipLogin()" style="margin-top:10px;">👀 Use Without Account</button>

        <div class="link" style="margin-top:15px;">
            Already have an account? <a href="/static/login.html">Login</a>
        </div>

        <p id="status-msg"></p>
    </div>

    <div style="text-align:center;padding:14px;font-size:0.8rem;color:#777;margin-top:10px">
        Developed by Nithish | Software Engineering Student
    </div>

    <script>
        if (localStorage.getItem('farmer_username')) {
            window.location.replace('/static/index.html');
        }

        async function guestLogin() {
            const username = document.getElementById('guest-username').value.trim();
            if (!username) { showMsg('Please enter a name for guest login.', 'red'); return; }
            try {
                const res = await fetch('/guest-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('farmer_username', data.username);
                    localStorage.setItem('login_type', 'guest');
                    showMsg('Welcome, ' + data.username + '!', 'green');
                    setTimeout(() => { window.location.href = '/static/index.html'; }, 800);
                } else {
                    showMsg(data.message, 'red');
                }
            } catch (e) {
                showMsg('Error: Could not reach server.', 'red');
            }
        }

        function skipLogin() {
            localStorage.setItem('farmer_username', 'Guest');
            localStorage.setItem('login_type', 'skip');
            window.location.href = '/static/index.html';
        }

        async function sendOTP() {
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const confirm = document.getElementById('reg-confirm').value.trim();

            if (!username) { showMsg('Please enter a username.', 'red'); return; }
            if (!email) { showMsg('Please enter your email.', 'red'); return; }
            if (!password || password.length < 6) { showMsg('Password must be at least 6 characters.', 'red'); return; }
            if (password !== confirm) { showMsg('Passwords do not match.', 'red'); return; }

            showMsg('Sending OTP to ' + email + '...', 'green');

            try {
                const res = await fetch('/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: username, email: email })
                });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('otp-step').style.display = 'block';
                    showMsg('OTP sent! Check inbox or spam folder.', 'green');
                } else {
                    showMsg('Error: ' + data.message, 'red');
                }
            } catch (e) {
                showMsg('Error: Could not reach server.', 'red');
            }
        }

        async function verifyAndRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const otp = document.getElementById('otp-input').value.trim();

            if (!otp || otp.length !== 6) { showMsg('Please enter the 6-digit OTP.', 'red'); return; }

            try {
                const otpRes = await fetch('/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp: otp })
                });
                const otpData = await otpRes.json();
                if (!otpData.success) { showMsg(otpData.message, 'red'); return; }

                const regRes = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const regData = await regRes.json();
                if (regData.success) {
                    localStorage.setItem('farmer_username', username);
                    localStorage.setItem('login_type', 'registered');
                    showMsg('Account created! Welcome ' + username + '!', 'green');
                    setTimeout(() => { window.location.href = '/static/index.html'; }, 1000);
                } else {
                    showMsg(regData.message, 'red');
                }
            } catch (e) {
                showMsg('Error: Could not reach server.', 'red');
            }
        }

        function showMsg(text, color) {
            const msg = document.getElementById('status-msg');
            msg.textContent = text;
            msg.style.color = color === 'red' ? '#d32f2f' : '#2d5e2d';
        }
    </script>
</body>
</html>
