<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yield Prediction - Farming Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background-color: #f4f9f4; color: #1a3d1a; }
        header {
            background: linear-gradient(135deg, #2d5e2d, #1b441b);
            color: white; padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
        }
        header a { color: white; text-decoration: none; font-size: 1.5rem; }
        header h1 { font-size: 1.1rem; flex: 1; }
        .lang-toggle {
            display: flex; background: rgba(255,255,255,0.2);
            border-radius: 20px; overflow: hidden;
        }
        .lang-toggle button {
            background: none; border: none; color: white;
            padding: 6px 12px; font-size: 0.85rem; cursor: pointer;
        }
        .lang-toggle button.active {
            background: white; color: #2d5e2d; font-weight: bold;
        }
        .profile-bar {
            background: #e8f5e9; padding: 10px 20px; text-align: right;
            border-bottom: 1px solid #d0e2d0; font-size: 0.85rem; color: #1b441b;
        }
        .container { max-width: 500px; margin: 20px auto; padding: 0 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 0.9rem; }
        select, input {
            width: 100%; padding: 12px; border: 1.5px solid #ccc;
            border-radius: 8px; font-size: 0.95rem; margin-bottom: 14px;
            font-family: inherit; background: white;
        }
        .row { display: flex; gap: 10px; }
        .row > div { flex: 1; }
        .input-row { display: flex; gap: 8px; align-items: flex-start; }
        .input-row input { flex: 1; }
        .mic-btn {
            width: 44px; height: 44px; border-radius: 50%;
            background: #2d5e2d; color: white; border: none;
            font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
        }
        .mic-btn.recording { background: #cc0000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
        .voice-status { text-align: center; color: #cc0000; font-size: 0.85rem; margin: -8px 0 10px; min-height: 18px; }
        .btn-row { display: flex; gap: 10px; }
        button.main-btn {
            flex: 1; padding: 14px; background-color: #2d5e2d;
            color: white; border: none; border-radius: 8px;
            font-size: 1.05rem; cursor: pointer;
        }
        button.main-btn:disabled { background-color: #999; }
        button.speak-btn {
            width: 48px; height: 48px; background: #1b441b;
            color: white; border: none; border-radius: 8px;
            font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
        }
        button.speak-btn.speaking { background: #cc0000; }
        .loading { text-align: center; margin-top: 20px; color: #555; display: none; }
        .result-box {
            background: white; border-radius: 12px; padding: 20px;
            margin-top: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: pre-wrap; line-height: 1.8; display: none; font-size: 0.95rem;
        }
        .disclaimer {
            font-size: 0.75rem; color: #999; text-align: center; margin-top: 10px;
        }
        footer {
            text-align: center; margin-top: 30px; padding: 14px;
            font-size: 0.8rem; color: #777;
        }
    </style>
</head>
<body>
    <header>
        <a href="/static/index.html">←</a>
        <h1 id="pageTitle">📈 Yield Prediction</h1>
        <div class="lang-toggle">
            <button id="btnEn" class="active" onclick="setLang('en')">EN</button>
            <button id="btnTa" onclick="setLang('ta')">தமிழ்</button>
        </div>
    </header>

    <div class="profile-bar">👤 Farmer Profile: <b id="farmerName">Guest</b></div>

    <div class="container">
        <label id="lblCrop">Crop Name:</label>
        <div class="input-row">
            <input type="text" id="cropInput" placeholder="e.g. Rice, Cotton, Sugarcane">
            <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
        </div>
        <div class="voice-status" id="voiceStatus"></div>

        <div class="row">
            <div>
                <label id="lblLandSize">Land Size:</label>
                <input type="number" id="landSize" placeholder="e.g. 2" min="0.1" step="0.1">
            </div>
            <div>
                <label id="lblUnit">Unit:</label>
                <select id="landUnit">
                    <option value="acre">Acre</option>
                    <option value="hectare">Hectare</option>
                    <option value="guntha">Guntha</option>
                </select>
            </div>
        </div>

        <label id="lblSoil">Soil Type:</label>
        <select id="soilType">
            <option>Loamy</option>
            <option>Clay</option>
            <option>Sandy</option>
            <option>Black (Regur)</option>
            <option>Red</option>
            <option>Alluvial</option>
        </select>

        <label id="lblIrrigation">Irrigation Method:</label>
        <select id="irrigation">
            <option>Rain-fed</option>
            <option>Canal</option>
            <option>Borewell</option>
            <option>Drip Irrigation</option>
            <option>Sprinkler</option>
        </select>

        <div class="btn-row">
            <button class="main-btn" id="predictBtn" onclick="getPrediction()">Predict Yield</button>
            <button class="speak-btn" id="speakBtn" onclick="toggleSpeak()" title="Read aloud">🔊</button>
        </div>

        <div class="loading" id="loading">Estimating your yield...</div>
        <div class="result-box" id="resultBox"></div>
        <p class="disclaimer" id="disclaimer">This is a general AI estimate, not a precise scientific forecast.</p>
    </div>

    <footer>Developed by Nithish | Software Engineering Student</footer>

    <script>
        document.getElementById('farmerName').textContent = localStorage.getItem('farmer_username') || 'Guest';

        let currentLang = 'en';
        let recognition = null;
        let isRecording = false;
        let synth = window.speechSynthesis;
        let isSpeaking = false;
        let lastResult = '';

        const t = {
            en: {
                title: '📈 Yield Prediction', crop: 'Crop Name:', landSize: 'Land Size:', unit: 'Unit:',
                soil: 'Soil Type:', irrigation: 'Irrigation Method:', cropPlaceholder: 'e.g. Rice, Cotton, Sugarcane',
                btn: 'Predict Yield', loading: 'Estimating your yield...',
                voiceListening: '🔴 Listening... speak now', voiceDone: '✅ Got it!',
                disclaimer: 'This is a general AI estimate, not a precise scientific forecast.'
            },
            ta: {
                title: '📈 மகசூல் கணிப்பு', crop: 'பயிர் பெயர்:', landSize: 'நிலப்பரப்பு:', unit: 'அளவு அலகு:',
                soil: 'மண் வகை:', irrigation: 'நீர்ப்பாசன முறை:', cropPlaceholder: 'எ.கா. நெல், பருத்தி, கரும்பு',
                btn: 'மகசூலை கணிக்கவும்', loading: 'மகசூலை மதிப்பிடுகிறது...',
                voiceListening: '🔴 கேட்கிறேன்... இப்போது பேசுங்கள்', voiceDone: '✅ கிடைத்தது!',
                disclaimer: 'இது ஒரு பொதுவான AI மதிப்பீடு, சரியான அறிவியல் கணிப்பு அல்ல.'
            }
        };

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('pageTitle').textContent = t[lang].title;
            document.getElementById('lblCrop').textContent = t[lang].crop;
            document.getElementById('lblLandSize').textContent = t[lang].landSize;
            document.getElementById('lblUnit').textContent = t[lang].unit;
            document.getElementById('lblSoil').textContent = t[lang].soil;
            document.getElementById('lblIrrigation').textContent = t[lang].irrigation;
            document.getElementById('cropInput').placeholder = t[lang].cropPlaceholder;
            document.getElementById('predictBtn').textContent = t[lang].btn;
            document.getElementById('loading').textContent = t[lang].loading;
            document.getElementById('disclaimer').textContent = t[lang].disclaimer;
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnTa').classList.toggle('active', lang === 'ta');
            localStorage.setItem('app_lang', lang);
        }

        const savedLang = localStorage.getItem('app_lang');
        if (savedLang) setLang(savedLang);

        function toggleVoice() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('Voice input not supported. Please use Chrome.');
                return;
            }
            if (isRecording) { recognition.stop(); return; }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SR();
            recognition.lang = currentLang === 'ta' ? 'ta-IN' : 'en-IN';
            recognition.interimResults = false;
            recognition.onstart = () => {
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
                document.getElementById('micBtn').textContent = '⏹';
                document.getElementById('voiceStatus').textContent = t[currentLang].voiceListening;
            };
            recognition.onresult = (e) => {
                document.getElementById('cropInput').value = e.results[0][0].transcript;
                document.getElementById('voiceStatus').textContent = t[currentLang].voiceDone;
            };
            recognition.onend = () => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').textContent = '🎤';
            };
            recognition.onerror = () => {
                isRecording = false;
                document.getElementById('micBtn').classList.remove('recording');
                document.getElementById('micBtn').textContent = '🎤';
                document.getElementById('voiceStatus').textContent = '❌ Could not hear. Try again.';
            };
            recognition.start();
        }

        function toggleSpeak() {
            if (isSpeaking) {
                synth.cancel();
                isSpeaking = false;
                document.getElementById('speakBtn').classList.remove('speaking');
                document.getElementById('speakBtn').textContent = '🔊';
                return;
            }
            if (!lastResult) { alert('No result to read. Please predict first.'); return; }
            const utterance = new SpeechSynthesisUtterance(lastResult);
            utterance.lang = currentLang === 'ta' ? 'ta-IN' : 'en-IN';
            utterance.rate = 0.9;
            utterance.onstart = () => {
                isSpeaking = true;
                document.getElementById('speakBtn').classList.add('speaking');
                document.getElementById('speakBtn').textContent = '⏹';
            };
            utterance.onend = () => {
                isSpeaking = false;
                document.getElementById('speakBtn').classList.remove('speaking');
                document.getElementById('speakBtn').textContent = '🔊';
            };
            synth.speak(utterance);
        }

        async function getPrediction() {
            const crop = document.getElementById('cropInput').value.trim();
            const landSize = document.getElementById('landSize').value.trim();
            const landUnit = document.getElementById('landUnit').value;
            const soilType = document.getElementById('soilType').value;
            const irrigation = document.getElementById('irrigation').value;
            const btn = document.getElementById('predictBtn');
            const loading = document.getElementById('loading');
            const resultBox = document.getElementById('resultBox');
            const username = localStorage.getItem('farmer_username') || 'Anonymous';

            if (!crop) { alert('Please enter a crop name.'); return; }
            if (!landSize || landSize <= 0) { alert('Please enter a valid land size.'); return; }

            if (isSpeaking) { synth.cancel(); isSpeaking = false; }

            btn.disabled = true;
            loading.style.display = 'block';
            resultBox.style.display = 'none';
            document.getElementById('voiceStatus').textContent = '';

            try {
                const params = new URLSearchParams({
                    crop, land_size: landSize, land_unit: landUnit,
                    soil_type: soilType, irrigation,
                    lang: currentLang, username
                });
                const response = await fetch(`/yield-prediction?${params}`);
                const data = await response.json();
                lastResult = data.result;
                resultBox.textContent = data.result;
                resultBox.style.display = 'block';
            } catch (e) {
                resultBox.textContent = 'Error: could not reach the server.';
                resultBox.style.display = 'block';
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
