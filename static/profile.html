<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Farming Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif; background-color: #f4f9f4;
            color: #1a3d1a; padding: 20px;
        }
        header {
            background: linear-gradient(135deg, #2d5e2d, #1b441b);
            color: white; padding: 15px 20px;
            display: flex; align-items: center; gap: 15px;
            margin: -20px -20px 20px -20px;
        }
        header a { color: white; text-decoration: none; font-size: 1.5rem; }
        header h1 { font-size: 1.3rem; }
        .container { max-width: 450px; margin: 0 auto; }
        .box {
            background: white; border-radius: 12px; padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06); margin-bottom: 20px;
        }
        .box h3 { color: #2d5e2d; margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 0.9rem; }
        input {
            width: 100%; padding: 10px; border: 1.5px solid #ccc;
            border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px;
        }
        input:disabled { background: #f5f5f5; color: #777; }
        button {
            width: 100%; background: #2d5e2d; color: white; border: none;
            padding: 12px; font-weight: bold; border-radius: 8px;
            cursor: pointer; font-size: 0.95rem;
        }
        button:hover { background: #1b5e20; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #666; }
        .stat-value { font-weight: bold; color: #2d5e2d; }
        #status-msg { text-align: center; font-weight: bold; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <a href="/static/index.html">←</a>
        <h1>👤 My Profile</h1>
    </header>

    <div class="container">

        <div class="box" style="text-align:center;">
            <div style="position:relative;width:100px;height:100px;margin:0 auto 15px;">
                <img id="profile-photo" src="" alt="" style="width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid #2d5e2d;display:none;background:#e8f5e9;">
                <div id="photo-placeholder" style="width:100px;height:100px;border-radius:50%;background:#e8f5e9;display:flex;align-items:center;justify-content:center;font-size:2.5rem;border:3px solid #2d5e2d;">👤</div>
                <label for="photo-input" style="position:absolute;bottom:0;right:0;background:#2d5e2d;color:white;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.9rem;">📷</label>
                <input type="file" id="photo-input" accept="image/*" style="display:none;" onchange="uploadPhoto(event)">
            </div>
            <p id="photo-status" style="font-size:0.8rem;color:#2d5e2d;min-height:18px;"></p>
        </div>

        <div class="box">
            <h3>Account Information</h3>
            <label>Username:</label>
            <input type="text" id="profile-username" disabled>
            <label>Email:</label>
            <input type="email" id="profile-email" disabled>
        </div>

        <div class="box">
            <h3>📊 Your Activity</h3>
            <div id="stats-container">
                <div class="stat-row"><span class="stat-label">Loading stats...</span></div>
            </div>
        </div>

        <div class="box">
            <h3>🔒 Change Password</h3>
            <label>Current Password:</label>
            <input type="password" id="current-password" placeholder="Enter current password">
            <label>New Password:</label>
            <input type="password" id="new-password" placeholder="Min 6 characters">
            <button onclick="changePassword()">Update Password</button>
            <p id="status-msg"></p>
        </div>
    </div>

    <script>
        const username = localStorage.getItem('farmer_username');
        if (!username) {
            window.location.replace('/static/login.html');
        }

        document.getElementById('profile-username').value = username;
        loadPhoto();

        async function loadPhoto() {
            try {
                const res = await fetch(`/get-photo?username=${encodeURIComponent(username)}`);
                const data = await res.json();
                if (data.success && data.photo) {
                    document.getElementById('profile-photo').src = data.photo;
                    document.getElementById('profile-photo').style.display = 'block';
                    document.getElementById('photo-placeholder').style.display = 'none';
                }
            } catch (e) {}
        }

        async function uploadPhoto(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (file.size > 1000000) {
                document.getElementById('photo-status').textContent = 'Image too large. Max 1MB.';
                document.getElementById('photo-status').style.color = '#d32f2f';
                return;
            }
            const reader = new FileReader();
            reader.onload = async function(e) {
                const base64 = e.target.result;
                document.getElementById('photo-status').textContent = 'Uploading...';
                try {
                    const res = await fetch('/upload-photo', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, photo: base64 })
                    });
                    const data = await res.json();
                    if (data.success) {
                        document.getElementById('profile-photo').src = base64;
                        document.getElementById('profile-photo').style.display = 'block';
                        document.getElementById('photo-placeholder').style.display = 'none';
                        document.getElementById('photo-status').textContent = 'Photo updated!';
                        document.getElementById('photo-status').style.color = '#2d5e2d';
                    } else {
                        document.getElementById('photo-status').textContent = data.message;
                        document.getElementById('photo-status').style.color = '#d32f2f';
                    }
                } catch (err) {
                    document.getElementById('photo-status').textContent = 'Upload failed.';
                    document.getElementById('photo-status').style.color = '#d32f2f';
                }
            };
            reader.readAsDataURL(file);
        }

        async function loadProfile() {
            try {
                const res = await fetch(`/profile?username=${encodeURIComponent(username)}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('profile-email').value = data.email;
                    document.getElementById('stats-container').innerHTML = `
                        <div class="stat-row"><span class="stat-label">Total Activities</span><span class="stat-value">${data.total_activities}</span></div>
                        <div class="stat-row"><span class="stat-label">Member Since</span><span class="stat-value">${data.member_since}</span></div>
                        <div class="stat-row"><span class="stat-label">Most Used Feature</span><span class="stat-value">${data.most_used_feature}</span></div>
                    `;
                }
            } catch (e) {
                document.getElementById('stats-container').innerHTML = '<div class="stat-row">Could not load stats.</div>';
            }
        }
        loadProfile();

        async function changePassword() {
            const current = document.getElementById('current-password').value.trim();
            const newPass = document.getElementById('new-password').value.trim();

            if (!current || !newPass) { showMsg('Please fill both fields.', 'red'); return; }
            if (newPass.length < 6) { showMsg('New password must be at least 6 characters.', 'red'); return; }

            try {
                const res = await fetch('/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, current_password: current, new_password: newPass })
                });
                const data = await res.json();
                if (data.success) {
                    showMsg('Password updated successfully!', 'green');
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                } else {
                    showMsg(data.message, 'red');
                }
            } catch (e) {
                showMsg('Error: Could not reach server.', 'red');
            }
        }

        function showMsg(text, color) {
            const msg = document.getElementById('status-msg');
            msg.textContent = text;
            msg.style.color = color === 'red' ? '#d32f2f' : '#2d5e2d';
        }
    </script>
</body>
</html>
